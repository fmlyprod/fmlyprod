<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMLY — Client Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #181818;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #ffffff;
    --red: #e53935;
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  #login-screen .logo {
    font-size: 1.1rem; font-weight: 700; letter-spacing: .35em; text-transform: uppercase;
    margin-bottom: 3rem; color: #fff;
  }
  #login-screen form {
    width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 1rem;
  }
  #login-screen input {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: .85rem 1.1rem; border-radius: 6px; font-size: .95rem; font-family: var(--font);
    outline: none; transition: border-color .2s;
  }
  #login-screen input:focus { border-color: #555; }
  #login-screen input::placeholder { color: var(--muted); }
  #login-screen button {
    background: #fff; color: #000; border: none; padding: .9rem 1.1rem;
    border-radius: 6px; font-size: .9rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font);
    transition: opacity .2s;
  }
  #login-screen button:hover { opacity: .85; }
  #login-screen .error {
    color: var(--red); font-size: .82rem; text-align: center; display: none;
  }

  /* ── APP ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* nav */
  #nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem; background: rgba(13,13,13,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  #nav .logo { font-size: .85rem; font-weight: 700; letter-spacing: .35em; text-transform: uppercase; }
  #nav .cats { display: flex; gap: .25rem; }
  #nav .cat-btn {
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: .45rem .9rem; border-radius: 4px; font-size: .78rem; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; cursor: pointer; font-family: var(--font);
    transition: color .2s, border-color .2s;
  }
  #nav .cat-btn.active, #nav .cat-btn:hover { color: #fff; border-color: var(--border); }
  #nav .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: .45rem .9rem; border-radius: 4px; font-size: .72rem; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font); transition: color .2s;
  }
  #nav .logout-btn:hover { color: #fff; }

  /* breadcrumb */
  #breadcrumb {
    padding: 1rem 2rem .5rem; font-size: .75rem; letter-spacing: .12em; color: var(--muted);
    text-transform: uppercase; display: none; align-items: center; gap: .5rem;
  }
  #breadcrumb span { cursor: pointer; transition: color .2s; }
  #breadcrumb span:hover { color: #fff; }
  #breadcrumb .sep { color: #444; }

  /* likes toolbar */
  #toolbar {
    padding: .5rem 2rem 1rem; display: none; align-items: center; gap: 1rem;
    font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  #toolbar .liked-count { display: flex; align-items: center; gap: .4rem; }
  #toolbar .download-liked-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: .35rem .8rem; border-radius: 4px; font-size: .7rem; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font); transition: color .2s;
    display: none;
  }
  #toolbar .download-liked-btn:hover { color: #fff; border-color: #555; }

  /* main content */
  #content { flex: 1; padding: 1.5rem 2rem 3rem; }

  /* ── FOLDER GRID ── */
  #folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .folder-card {
    cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--surface);
    border: 1px solid var(--border); position: relative; aspect-ratio: 4/3;
    transition: transform .2s, border-color .2s;
  }
  .folder-card:hover { transform: translateY(-2px); border-color: #444; }
  .folder-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity .3s; opacity: 0;
  }
  .folder-card img.loaded { opacity: 1; }
  .folder-card .card-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    padding: 2rem .9rem .8rem; color: #fff;
  }
  .folder-card .card-label .name {
    font-size: .85rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .folder-card .card-label .count {
    font-size: .7rem; color: rgba(255,255,255,.5); margin-top: .2rem; letter-spacing: .05em;
  }

  /* ── PHOTO GRID ── */
  #photo-grid {
    columns: 4; gap: 6px; display: none;
  }
  @media (max-width: 1200px) { #photo-grid { columns: 3; } }
  @media (max-width: 800px)  { #photo-grid { columns: 2; } }
  @media (max-width: 480px)  { #photo-grid { columns: 1; } }

  .photo-item {
    break-inside: avoid; margin-bottom: 6px; position: relative;
    cursor: pointer; overflow: hidden; border-radius: 4px; background: var(--surface);
  }
  .photo-item img {
    display: block; width: 100%; height: auto; transition: opacity .3s; opacity: 0;
  }
  .photo-item img.loaded { opacity: 1; }
  .photo-item .photo-actions {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: .6rem;
  }
  .photo-item:hover .photo-actions { opacity: 1; }
  .photo-item .photo-actions .action-btn {
    background: rgba(0,0,0,.65); border: none; color: #fff; border-radius: 50%;
    width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; margin-left: .4rem; transition: background .2s, transform .15s;
    flex-shrink: 0;
  }
  .photo-item .photo-actions .action-btn:hover { background: rgba(0,0,0,.9); transform: scale(1.08); }
  .photo-item .photo-actions .action-btn svg { width: 16px; height: 16px; }
  .photo-item .photo-actions .like-btn.liked svg { fill: var(--red); stroke: var(--red); }
  .photo-item .photo-actions .like-btn svg { fill: none; stroke: #fff; stroke-width: 2; }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.95); align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px;
    user-select: none;
  }
  #lightbox .lb-close {
    position: absolute; top: 1.2rem; right: 1.5rem;
    background: none; border: none; color: #fff; font-size: 1.8rem;
    cursor: pointer; line-height: 1; opacity: .7; transition: opacity .2s;
  }
  #lightbox .lb-close:hover { opacity: 1; }
  #lightbox .lb-prev, #lightbox .lb-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.08); border: none; color: #fff;
    width: 48px; height: 72px; border-radius: 4px; font-size: 1.4rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .2s; user-select: none;
  }
  #lightbox .lb-prev:hover, #lightbox .lb-next:hover { background: rgba(255,255,255,.18); }
  #lightbox .lb-prev { left: 1rem; }
  #lightbox .lb-next { right: 1rem; }
  #lightbox .lb-actions {
    position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    display: flex; gap: .75rem;
  }
  #lightbox .lb-actions .lb-btn {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    color: #fff; padding: .5rem 1.1rem; border-radius: 20px; cursor: pointer;
    display: flex; align-items: center; gap: .45rem; font-size: .8rem;
    letter-spacing: .08em; font-family: var(--font); transition: background .2s;
  }
  #lightbox .lb-actions .lb-btn:hover { background: rgba(255,255,255,.2); }
  #lightbox .lb-actions .lb-btn svg { width: 15px; height: 15px; }
  #lightbox .lb-actions .lb-like.liked { color: var(--red); border-color: rgba(229,57,53,.4); }
  #lightbox .lb-actions .lb-like.liked svg { fill: var(--red); stroke: var(--red); }
  #lightbox .lb-actions .lb-like svg { fill: none; stroke: currentColor; stroke-width: 2; }
  #lightbox .lb-counter {
    position: absolute; top: 1.4rem; left: 50%; transform: translateX(-50%);
    font-size: .75rem; letter-spacing: .12em; color: rgba(255,255,255,.45);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="logo">FMLY</div>
  <form id="login-form" onsubmit="return tryLogin(event)">
    <input id="un" type="text" placeholder="Username" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Enter</button>
    <div class="error" id="login-error">Incorrect credentials</div>
  </form>
</div>

<!-- APP -->
<div id="app">
  <nav id="nav">
    <div class="logo">FMLY</div>
    <div class="cats" id="cat-tabs"></div>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </nav>
  <div id="breadcrumb">
    <span id="bc-cat" onclick="goCategory()"></span>
    <span class="sep">›</span>
    <span id="bc-loc"></span>
  </div>
  <div id="toolbar">
    <div class="liked-count">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span id="liked-count-label">0 liked</span>
    </div>
    <button class="download-liked-btn" id="dl-liked-btn" onclick="downloadLiked()">Download liked</button>
  </div>
  <div id="content">
    <div id="folder-grid"></div>
    <div id="photo-grid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <div class="lb-counter" id="lb-counter"></div>
  <button class="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-actions">
    <button class="lb-btn lb-like" id="lb-like-btn" onclick="lbToggleLike()">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Like
    </button>
    <button class="lb-btn" onclick="downloadCurrent()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const CREDS = { 'Bakery': 'Family' };
const MANIFEST_URL = 'images/bakery/manifest.json';

// ── STATE ────────────────────────────────────────────────────────
let db = null;        // manifest data
let currentCat = null;
let currentLoc = null;
let currentPhotos = [];
let lbIndex = 0;
let likes = {};       // { path: true }

// ── INIT ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  likes = JSON.parse(localStorage.getItem('fmly_likes') || '{}');
  // check session
  if (localStorage.getItem('fmly_session') === 'ok') {
    initApp();
  }
});

function tryLogin(e) {
  e.preventDefault();
  const un = document.getElementById('un').value.trim();
  const pw = document.getElementById('pw').value;
  if (CREDS[un] && CREDS[un] === pw) {
    localStorage.setItem('fmly_session', 'ok');
    initApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
  return false;
}

function logout() {
  localStorage.removeItem('fmly_session');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('un').value = '';
  document.getElementById('pw').value = '';
}

async function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  if (!db) {
    const r = await fetch(MANIFEST_URL);
    db = await r.json();
  }

  // build category tabs
  const tabsEl = document.getElementById('cat-tabs');
  tabsEl.innerHTML = '';
  Object.keys(db).forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.onclick = () => showCategory(cat);
    tabsEl.appendChild(btn);
  });

  showCategory(Object.keys(db)[0]);
}

// ── CATEGORY VIEW ────────────────────────────────────────────────
function showCategory(cat) {
  currentCat = cat;
  currentLoc = null;

  // tabs
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });

  document.getElementById('breadcrumb').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('photo-grid').style.display = 'none';
  document.getElementById('folder-grid').style.display = 'grid';

  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';

  const locations = db[cat];
  Object.entries(locations).forEach(([loc, photos]) => {
    if (!photos.length) return;
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.onclick = () => showLocation(cat, loc);

    const img = document.createElement('img');
    img.src = photos[0];
    img.alt = loc;
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => { if (photos[1]) { img.src = photos[1]; } };

    const label = document.createElement('div');
    label.className = 'card-label';
    label.innerHTML = `<div class="name">${loc}</div><div class="count">${photos.length} photos</div>`;

    card.appendChild(img);
    card.appendChild(label);
    grid.appendChild(card);
  });
}

// ── LOCATION / PHOTO VIEW ────────────────────────────────────────
function showLocation(cat, loc) {
  currentCat = cat;
  currentLoc = loc;
  currentPhotos = db[cat][loc];

  document.getElementById('folder-grid').style.display = 'none';

  // breadcrumb
  const bc = document.getElementById('breadcrumb');
  bc.style.display = 'flex';
  document.getElementById('bc-cat').textContent = cat;
  document.getElementById('bc-loc').textContent = loc;

  // toolbar
  const toolbar = document.getElementById('toolbar');
  toolbar.style.display = 'flex';
  updateLikedCount();

  // photo grid
  const grid = document.getElementById('photo-grid');
  grid.style.display = 'block';
  grid.innerHTML = '';

  currentPhotos.forEach((path, idx) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.dataset.idx = idx;

    const img = document.createElement('img');
    img.src = path;
    img.alt = '';
    img.loading = 'lazy';
    img.onload = () => img.classList.add('loaded');
    img.onclick = () => openLightbox(idx);

    const actions = document.createElement('div');
    actions.className = 'photo-actions';

    const likeBtn = document.createElement('button');
    likeBtn.className = 'action-btn like-btn' + (likes[path] ? ' liked' : '');
    likeBtn.title = 'Like';
    likeBtn.innerHTML = heartSVG();
    likeBtn.onclick = (e) => { e.stopPropagation(); toggleLike(path, likeBtn); };

    const dlBtn = document.createElement('button');
    dlBtn.className = 'action-btn';
    dlBtn.title = 'Download';
    dlBtn.innerHTML = downloadSVG();
    dlBtn.onclick = (e) => { e.stopPropagation(); downloadFile(path); };

    actions.appendChild(likeBtn);
    actions.appendChild(dlBtn);
    item.appendChild(img);
    item.appendChild(actions);
    grid.appendChild(item);
  });
}

function goCategory() { showCategory(currentCat); }

// ── LIKES ────────────────────────────────────────────────────────
function toggleLike(path, btn) {
  if (likes[path]) {
    delete likes[path];
    btn && btn.classList.remove('liked');
  } else {
    likes[path] = true;
    btn && btn.classList.add('liked');
  }
  localStorage.setItem('fmly_likes', JSON.stringify(likes));
  updateLikedCount();
  // sync lightbox button
  if (currentPhotos[lbIndex] === path) syncLbLike();
}

function updateLikedCount() {
  const n = Object.keys(likes).length;
  document.getElementById('liked-count-label').textContent = n + ' liked';
  const dlBtn = document.getElementById('dl-liked-btn');
  dlBtn.style.display = n > 0 ? 'block' : 'none';
}

function downloadLiked() {
  Object.keys(likes).forEach((path, i) => {
    setTimeout(() => downloadFile(path), i * 300);
  });
}

// ── DOWNLOAD ─────────────────────────────────────────────────────
function downloadFile(path) {
  const a = document.createElement('a');
  a.href = path;
  a.download = path.split('/').pop();
  a.click();
}

// ── LIGHTBOX ─────────────────────────────────────────────────────
function openLightbox(idx) {
  lbIndex = idx;
  document.getElementById('lightbox').classList.add('open');
  renderLb();
  document.addEventListener('keydown', lbKey);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKey);
}

function lbKey(e) {
  if (e.key === 'ArrowRight') lbNav(1);
  else if (e.key === 'ArrowLeft') lbNav(-1);
  else if (e.key === 'Escape') closeLightbox();
}

function lbNav(dir) {
  lbIndex = (lbIndex + dir + currentPhotos.length) % currentPhotos.length;
  renderLb();
}

function renderLb() {
  const path = currentPhotos[lbIndex];
  document.getElementById('lb-img').src = path;
  document.getElementById('lb-counter').textContent =
    (lbIndex + 1) + ' / ' + currentPhotos.length;
  syncLbLike();
}

function syncLbLike() {
  const path = currentPhotos[lbIndex];
  const btn = document.getElementById('lb-like-btn');
  btn.classList.toggle('liked', !!likes[path]);
}

function lbToggleLike() {
  const path = currentPhotos[lbIndex];
  // find the grid button if visible
  const gridBtn = document.querySelector(`.photo-item[data-idx="${lbIndex}"] .like-btn`);
  toggleLike(path, gridBtn);
  syncLbLike();
}

function downloadCurrent() { downloadFile(currentPhotos[lbIndex]); }

// ── ICONS ────────────────────────────────────────────────────────
function heartSVG() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </svg>`;
}
function downloadSVG() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>`;
}
</script>
</body>
</html>
