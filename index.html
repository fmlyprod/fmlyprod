<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMLY Production</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Mono:wght@300;400&family=Dancing+Script:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080808;--surface:#111;--border:rgba(255,255,255,0.07);--text:#f2ede4;--muted:rgba(242,237,228,0.4);--dim:rgba(242,237,228,0.15);--accent:#d4a847;--accent2:#c13b2a;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:18px 48px;}
.nav-logo{display:flex;align-items:center;cursor:pointer;text-decoration:none;}
.nav-logo img{height:38px;width:auto;}
.nav-links{display:flex;gap:40px;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:color .25s;cursor:pointer;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.page{display:none;min-height:100vh;}
.page.active{display:block;}
.hero{height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;pointer-events:none;}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(8,8,8,.75) 100%);pointer-events:none;}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;}
.hero-pre{font-size:10px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-bottom:20px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,16vw,180px);letter-spacing:.06em;line-height:.85;color:var(--text);}
.hero-title span{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:clamp(60px,10vw,120px);color:var(--accent);letter-spacing:.02em;display:block;}
.hero-tagline{margin-top:28px;font-size:10px;letter-spacing:.25em;color:rgba(240,235,225,0.95);text-transform:uppercase;}
.hero-scroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dim);font-size:9px;letter-spacing:.2em;text-transform:uppercase;}
.scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,var(--dim),transparent);animation:sp 2s ease-in-out infinite;}
@keyframes sp{0%,100%{opacity:.3}50%{opacity:1}}
.sec-head{display:flex;align-items:center;gap:20px;padding:48px 48px 28px;font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--border);}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border);}
footer{padding:48px 48px 40px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--border);}
.foot-brand{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.1em;color:rgba(255,255,255,.05);}
.foot-copy{font-size:9px;color:var(--dim);letter-spacing:.15em;margin-top:8px;}
.foot-links{display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.foot-links a{font-size:9px;letter-spacing:.2em;color:var(--muted);text-decoration:none;text-transform:uppercase;transition:color .25s;cursor:pointer;}
.foot-links a:hover{color:var(--text);}
.val-link{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:color .25s;cursor:pointer;}
.val-link:hover{color:var(--text);}
.arrow{width:44px;height:1px;background:currentColor;position:relative;transition:width .3s;}
.val-link:hover .arrow{width:68px;}
.arrow::after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);}
.view-all-bar{display:flex;align-items:center;justify-content:space-between;padding:28px 48px;border-bottom:1px solid var(--border);}
.work-split{height:100vh;display:grid;grid-template-columns:1fr 1fr;}
.ws-side{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;border-right:1px solid var(--border);}
.ws-side:last-child{border-right:none;}
.ws-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;transform:scale(1.05);transition:opacity .6s,transform .6s;}
.ws-side:hover .ws-bg{opacity:.35;transform:scale(1);}
.ws-overlay{position:absolute;inset:0;background:rgba(8,8,8,.5);transition:background .4s;}
.ws-side:hover .ws-overlay{background:rgba(8,8,8,.3);}
.ws-label{position:relative;z-index:2;text-align:center;}
.ws-label h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,9vw,120px);letter-spacing:.08em;color:var(--text);line-height:1;}
.ws-label p{font-size:10px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-top:12px;}
.works-grid{display:grid;grid-template-columns:1fr 1fr;}
.work-item{position:relative;overflow:hidden;border-right:1px solid var(--border);border-bottom:1px solid var(--border);aspect-ratio:16/10;background:#0c0c0c;cursor:pointer;}
.work-item:nth-child(even){border-right:none;}
.w-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1);}
.work-item:hover .w-video{opacity:1;transform:scale(1);}
.w-splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;background:rgba(8,8,8,.85);transition:opacity .5s;padding:24px;}
.work-item:hover .w-splash{opacity:0;pointer-events:none;}
.w-splash-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,3vw,52px);letter-spacing:.15em;color:var(--text);text-align:center;line-height:1.1;}
.w-splash-sub{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:8px;text-align:center;}
.w-splash-play{margin-top:20px;width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.w-splash-play svg{fill:rgba(255,255,255,.6);}
.w-hover{position:absolute;bottom:0;left:0;right:0;padding:20px 28px;background:linear-gradient(to top,rgba(8,8,8,.95) 0%,transparent 100%);z-index:3;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;}
.work-item:hover .w-hover{opacity:1;transform:translateY(0);}
.w-client{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.08em;color:var(--text);line-height:1;margin-bottom:4px;}
.w-director{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.w-cta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;}
.w-play-sm{width:18px;height:18px;border:1px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.w-play-sm svg{fill:var(--accent);}
.film-back-bar{display:flex;align-items:center;gap:16px;padding:20px 48px;border-bottom:1px solid var(--border);cursor:pointer;font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;transition:color .2s;}
.film-back-bar:hover{color:var(--text);}
.stills-back-bar{display:flex;align-items:center;gap:16px;padding:20px 48px;border-bottom:1px solid var(--border);cursor:pointer;font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;transition:color .2s;position:sticky;top:72px;z-index:100;background:var(--bg);}
.stills-back-bar:hover{color:var(--text);}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1);}
.reveal.visible{opacity:1;transform:translateY(0);}
.about-wrap{padding-top:80px;min-height:100vh;display:flex;flex-direction:column;}
